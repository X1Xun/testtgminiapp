<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TG News App</title>
        <style>
        /* Новая серая цветовая палитра */
        :root {
            --bg-color: #1e1e1e;          /* Глубокий темно-серый фон приложения */
            --text-color: #ffffff;        /* Белый текст для заголовков */
            --sub-text: #e0e0e0;          /* Светло-серый текст для основного контента */
            --hint-color: #8a8a8f;        /* Серебристый цвет для дат и счетчиков */
            --button-color: #3a3a3c;      /* Серые нативные кнопки */
            --button-active: #545456;     /* Активные кнопки */
            --sec-bg: #2c2c2e;            /* Более светлый серый для карточек новостей */
            --accent-color: #29b6f6;      /* Мягкий голубой для кликабельных элементов/кнопок назад */
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 480px; 
            padding: 16px;
            box-sizing: border-box;
        }

        .header {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--text-color);
        }

        .categories-chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            margin-bottom: 20px;
            padding-bottom: 4px;
        }
        .categories-chips::-webkit-scrollbar { display: none; }

        .news-card {
            background: var(--sec-bg);
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .news-card:active { transform: scale(0.98); }
        .news-body { padding: 16px; }
        .news-title { font-size: 18px; font-weight: 700; line-height: 1.3; margin: 0 0 8px 0; color: var(--text-color); }
        
        .news-excerpt {
            font-size: 15px;
            line-height: 1.4;
            color: var(--sub-text);
            opacity: 0.9;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
        .news-excerpt img { display: none !important; }

        .news-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.08);
        }
        .news-date { font-size: 13px; color: var(--hint-color); }

        .like-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,255,255,0.05);
            border: none;
            color: var(--hint-color);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: 20px;
            transition: all 0.2s;
        }
        .like-btn.liked { 
            color: #ff453a; 
            background: rgba(255, 69, 58, 0.15);
        }

        /* Полная новость */
        .full-news-page {
            position: fixed;
            top: 0;
            left: 50%;
            transform: translateX(-50%) translateY(100%);
            width: 100%;
            max-width: 480px;
            height: 100%;
            background: var(--bg-color);
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.1, 0.76, 0.55, 0.94);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .full-news-page.open { transform: translateX(-50%) translateY(0); }
        
        .full-news-header { 
            padding: 16px; 
            display: flex; 
            align-items: center; 
            border-bottom: 1px solid rgba(255,255,255,0.08); 
            background: var(--bg-color); 
        }
        .back-btn { background: transparent; border: none; color: var(--accent-color); font-size: 16px; font-weight: 600; cursor: pointer; padding: 0; }
        
        .full-news-scroll { padding: 20px 16px; overflow-y: auto; flex-grow: 1; }
        .full-news-title { font-size: 24px; font-weight: 800; line-height: 1.2; margin: 0 0 12px 0; color: var(--text-color); }
        .full-news-date { font-size: 14px; color: var(--hint-color); margin-bottom: 20px; }
        
        .full-news-content { font-size: 16px; line-height: 1.5; color: var(--sub-text); }
        .full-news-content img { max-width: 100%; height: auto; border-radius: 12px; margin: 12px 0; display: block; }
        .full-news-content p { margin: 0 0 16px 0; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">Свежие новости</div>
        <div id="news-container">
            <div style="text-align:center; color:gray; margin-top:20px;">Загрузка ленты...</div>
        </div>
    </div>

    <div id="full-news-page" class="full-news-page">
        <div class="full-news-header">
            <button class="back-btn" onclick="closeArticle()">◀ Назад</button>
        </div>
        <div class="full-news-scroll">
            <h1 id="full-title" class="full-news-title"></h1>
            <div id="full-date" class="full-news-date"></div>
            <div id="full-content" class="full-news-content"></div>
        </div>
    </div>

    <!-- Переносим скрипт Telegram вниз, чтобы он загружался после прогрузки элементов страницы -->
    <script src="https://telegram.org"></script>
    <script>
        // Вставь сюда СВОЮ ссылку от Render (без слеша на конце)
        const API_URL = 'https://testtgminiapp-wmnp.onrender.com'; 

        let tg = null;
        if (typeof window !== 'undefined' && window.Telegram && window.Telegram.WebApp) {
            tg = window.Telegram.WebApp;
            try { tg.ready(); tg.expand(); } catch (e) {}
        }

        let allNews = [];
        loadNews(); 

        // Функция для получения списка лайкнутых новостей из памяти устройства
        function getLikedNews() {
            const liked = localStorage.getItem('liked_articles');
            return liked ? JSON.parse(liked) : [];
        }

        // Функция для сохранения списка лайкнутых новостей в память устройства
        function saveLikedNews(likedArray) {
            localStorage.setItem('liked_articles', JSON.stringify(likedArray));
        }

        async function loadNews() {
            try {
                const response = await fetch(`${API_URL}/api/news`);
                allNews = await response.json();

                const container = document.getElementById('news-container');
                if (!allNews || allNews.length === 0) {
                    container.innerHTML = '<div style="text-align:center; color:gray; margin-top:20px;">Новостей пока нет...</div>';
                    return;
                }
            
                // Получаем массив ID, которые этот пользователь уже лайкал ранее
                const myLikes = getLikedNews();
            
                container.innerHTML = '';
                allNews.forEach(item => {
                    // Проверяем, ставил ли текущий пользователь лайк этой новости
                    const isAlreadyLiked = myLikes.includes(item.id);
                    const likedClass = isAlreadyLiked ? 'liked' : '';
                
                    const card = document.createElement('div');
                    card.className = 'news-card';
                    card.setAttribute('onclick', `openArticle(${item.id})`);
                    card.innerHTML = `
                        <div class="news-body">
                            <h2 class="news-title">${item.title}</h2>
                            <div class="news-excerpt">${item.content}</div>
                            <div class="news-footer">
                                <div class="news-date">${new Date(item.createdAt).toLocaleString('ru-RU')}</div>
                                <!-- Добавляем класс liked, если новость уже была лайкнута ранее -->
                                <button class="like-btn ${likedClass}" onclick="toggleLike(event, this, ${item.id})">
                                    ❤️ <span class="like-count">${item.likes || 0}</span>
                                </button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                console.error(e);
                document.getElementById('news-container').innerHTML = 
                    '<div style="text-align:center; color:red; margin-top:20px;">Ошибка загрузки данных.</div>';
            }
        }

        async function toggleLike(event, btn, id) {
            if (event && event.stopPropagation) event.stopPropagation();

            const countSpan = btn.querySelector('.like-count');
            let currentCount = parseInt(countSpan.innerText) || 0;

            // Проверяем текущее состояние кнопки на экране
            const isLiked = btn.classList.contains('liked');
            const action = isLiked ? 'unlike' : 'like';
        
            let myLikes = getLikedNews();
        
            // Оптимистичное обновление интерфейса на экране для мгновенного отклика
            if (isLiked) {
                btn.classList.remove('liked');
                countSpan.innerText = Math.max(0, currentCount - 1);
                // Удаляем ID из списка моих лайков
                myLikes = myLikes.filter(likedId => likedId !== id);
            } else {
                btn.classList.add('liked');
                countSpan.innerText = currentCount + 1;
                // Добавляем ID в список моих лайков
                if (!myLikes.includes(id)) myLikes.push(id);

                if (tg && tg.HapticFeedback) { 
                    try { tg.HapticFeedback.impactOccurred('light'); } catch(e) {} 
                }
            }
        
            // Сохраняем обновленный список в локальную память устройства
            saveLikedNews(myLikes);
        
            // Отправляем запрос на сервер, чтобы обновить глобальный счетчик в news.json
            try {
                const response = await fetch(`${API_URL}/api/news/${id}/like`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action })
                });
            
                if (!response.ok) throw new Error('Ошибка сервера');

                const result = await response.json();
                countSpan.innerText = result.likes; // Синхронизируем точную цифру с сервера
            } catch (e) {
                console.error("Не удалось синхронизировать лайк с сервером:", e);
                // В случае жесткого сбоя сети можно перезагрузить ленту, чтобы вернуть верные значения
            }
        }

        function openArticle(id) {
            const article = allNews.find(item => item.id == id);
            if (!article) return;
            document.getElementById('full-title').innerText = article.title;
            document.getElementById('full-date').innerText = new Date(article.createdAt).toLocaleString('ru-RU');
            document.getElementById('full-content').innerHTML = article.content;
            document.getElementById('full-news-page').classList.add('open');

            if (tg && tg.BackButton) {
                try { tg.BackButton.show(); tg.BackButton.onClick(closeArticle); } catch(e) {}
            }
        }

        document.querySelectorAll('.chip').forEach(chip => {
            chip.addEventListener('click', (e) => {
                document.querySelector('.chip.active').classList.remove('active');
                chip.classList.add('active');
            });
        });

        function closeArticle() {
            document.getElementById('full-news-page').classList.remove('open');
            if (tg && tg.BackButton) { try { tg.BackButton.hide(); } catch(e) {} }
        }


    </script>
</body>
</html>
